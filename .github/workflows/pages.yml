name: Pages
on:
  push:
    branches: [main]
    paths: ["index.html", "styles.css", "manifest.webmanifest", "sw.js", "js/**", "icons/**", "textures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kokoa sivusto
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js js icons textures _site/
          # Versio tiedostojen osoitteisiin, jotta selain ei yhdistä uutta HTML:ää vanhaan JS:ään/CSS:ään
          v="${GITHUB_SHA::7}"
          sed -i -E "s/(src|href)=\"(js\/main\.js|styles\.css)\"/\1=\"\2?v=$v\"/g" _site/index.html
          grep -c "?v=$v" _site/index.html | grep -qx 2 || { echo "::error::Versioparametrien lisäys index.html:ään epäonnistui"; exit 1; }
          # Service workerin versio: muuttunut tiedosto saa selaimen asentamaan uuden workerin
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"$v\";/" _site/sw.js
          grep -q "^const VERSION = \"$v\";" _site/sw.js || { echo "::error::Service workerin version asetus epäonnistui"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
