<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="30%" cy="10%" r="100%">
      <stop offset="0" stop-color="#16213c"/>
      <stop offset="0.6" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#c46a2c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- Sisältö pysyy maskattavan kuvakkeen turva-alueella (keskimmäinen 80 %) -->
  <g fill="#e8eefc">
    <circle cx="140" cy="150" r="5"/>
    <circle cx="200" cy="96" r="3.5"/>
    <circle cx="120" cy="290" r="4"/>
    <circle cx="390" cy="380" r="4.5"/>
    <circle cx="300" cy="420" r="3"/>
  </g>
  <!-- Rengasplaneetta -->
  <circle cx="352" cy="160" r="54" fill="url(#planet)"/>
  <ellipse cx="352" cy="160" rx="92" ry="22" fill="none" stroke="#5ed6ff" stroke-width="7" transform="rotate(-18 352 160)" opacity="0.85"/>
  <path d="M298 160 a54 54 0 0 0 108 0" fill="url(#planet)" transform="rotate(-18 352 160)"/>
