    <path d="M230 400 C214 430 222 452 230 470 C238 452 246 430 230 400 Z" fill="url(#flame)"/>
    <path d="M230 176 C262 204 274 262 268 332 L268 392 L192 392 L192 332 C186 262 198 204 230 176 Z" fill="#e8eefc"/>
    <path d="M192 330 L160 384 L160 404 L192 392 Z M268 330 L300 384 L300 404 L268 392 Z" fill="#5ed6ff"/>
    <circle cx="230" cy="268" r="20" fill="#0d1220" stroke="#5ed6ff" stroke-width="7"/>
    <rect x="206" y="392" width="48" height="12" rx="3" fill="#8b9ac0"/>
  </g>
